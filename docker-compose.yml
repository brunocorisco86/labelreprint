services:
  web:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: labelreprint_web
    restart: unless-stopped
    mem_limit: 96m
    env_file:
      - .env
    environment:
      - TZ=America/Sao_Paulo
      - PYTHONUNBUFFERED=1
    ports:
      - "127.0.0.1:${WEB_PORT:-5001}:5001"
    volumes:
      - ./data:/app/data
      - ./Export:/app/Export
      - ./logs:/app/logs
      - ./config:/app/config
      - ./assets:/app/assets
    networks:
      - default
      - hermes_mesh
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

networks:
  hermes_mesh:
    external: true
    name: ${DOCKER_MESH_NETWORK:-hermes_mesh_network}
